services:
  - type: web
    name: BatiSmart-Roof-IA
    env: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: NODE_VERSION
        value: 20.19.0
